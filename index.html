<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>YouTube 影片標題產生器</title>

  <!-- CDN:Tailwind CSS / Fuse.js（模糊搜尋）/ 資料 / 設定 / 邏輯 / Alpine.js -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0/dist/fuse.min.js"></script>
  <script src="data/iidx-songs.js"></script>
  <script src="data/ddr-songs.js"></script>
  <script src="js/games.js"></script>
  <script src="js/app.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>

  <style>
    [x-cloak] { display: none !important; }

    /* IIDX 官方難度色:未選為框線+文字著色,選取為整顆填滿 */
    .diff-btn {
      border: 1px solid;
      border-radius: 0.5rem;
      padding: 0.5rem;
      font-size: 0.75rem;
      font-weight: 600;
      background: #0f172a; /* slate-900 */
      transition: all 0.15s;
      cursor: pointer;
    }
    .diff-normal      { color: #4a90d9; border-color: #2c4a66; }
    .diff-hyper       { color: #e0a41f; border-color: #6a5320; }
    .diff-another     { color: #e3564b; border-color: #6a2f2c; }
    .diff-leggendaria { color: #c840e0; border-color: #5a2a66; }

    .diff-normal:hover      { border-color: #4a90d9; }
    .diff-hyper:hover       { border-color: #e0a41f; }
    .diff-another:hover     { border-color: #e3564b; }
    .diff-leggendaria:hover { border-color: #c840e0; }

    .diff-normal.is-active      { background: #2f80d6; border-color: #2f80d6; color: #fff; }
    .diff-hyper.is-active       { background: #e0982a; border-color: #e0982a; color: #1a1200; }
    .diff-another.is-active     { background: #dc3c33; border-color: #dc3c33; color: #fff; }
    .diff-leggendaria.is-active { background: #b825d4; border-color: #b825d4; color: #fff; }

    /* DDR 官方難度色:BASIC 黃 / DIFFICULT 紅 / EXPERT 綠 / CHALLENGE 紫紅 */
    .diff-basic      { color: #f0b429; border-color: #6a5320; }
    .diff-difficult  { color: #ef5350; border-color: #6a2f2c; }
    .diff-expert     { color: #35c46a; border-color: #285138; }
    .diff-challenge  { color: #e457c8; border-color: #5a2a55; }

    .diff-basic:hover      { border-color: #f0b429; }
    .diff-difficult:hover  { border-color: #ef5350; }
    .diff-expert:hover     { border-color: #35c46a; }
    .diff-challenge:hover  { border-color: #e457c8; }

    .diff-basic.is-active      { background: #e0982a; border-color: #e0982a; color: #1a1200; }
    .diff-difficult.is-active  { background: #dc3c33; border-color: #dc3c33; color: #fff; }
    .diff-expert.is-active     { background: #1f9d52; border-color: #1f9d52; color: #fff; }
    .diff-challenge.is-active  { background: #c8259e; border-color: #c8259e; color: #fff; }

    /* 搜尋結果的等級 chip:沿用難度色(淡色底 + 該難度文字色) */
    .badge { border: 1px solid transparent; }
    .badge-normal      { color: #6fb1ec; background: rgba(74, 144, 217, 0.15); border-color: rgba(74, 144, 217, 0.35); }
    .badge-hyper       { color: #f0bf55; background: rgba(224, 164, 31, 0.15); border-color: rgba(224, 164, 31, 0.35); }
    .badge-another     { color: #f0837a; background: rgba(227, 86, 75, 0.15);  border-color: rgba(227, 86, 75, 0.35); }
    .badge-leggendaria { color: #de7cee; background: rgba(200, 64, 224, 0.15); border-color: rgba(200, 64, 224, 0.35); }
    .badge-basic       { color: #f0bf55; background: rgba(224, 164, 31, 0.15); border-color: rgba(224, 164, 31, 0.35); }
    .badge-difficult   { color: #f0837a; background: rgba(227, 86, 75, 0.15);  border-color: rgba(227, 86, 75, 0.35); }
    .badge-expert      { color: #5fd98a; background: rgba(31, 157, 82, 0.18);  border-color: rgba(31, 157, 82, 0.4); }
    .badge-challenge   { color: #ee7cd8; background: rgba(200, 37, 158, 0.15); border-color: rgba(200, 37, 158, 0.4); }
  </style>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 antialiased">
  <div x-data="titleGen" x-cloak>

    <!-- ── Nav ── -->
    <nav class="sticky top-0 z-10 border-b border-slate-800 bg-slate-950/90 backdrop-blur">
      <div class="mx-auto flex max-w-3xl flex-col gap-2 px-4 py-3 sm:flex-row sm:items-center sm:justify-between">
        <a href="#iidx" @click="switchGame('iidx')"
           class="shrink-0 text-lg font-bold tracking-tight">🎬 標題產生器</a>
        <div class="-mx-1 flex gap-1 overflow-x-auto">
          <template x-for="(g, id) in window.GAMES" :key="id">
            <template x-if="g.implemented">
              <button type="button" @click="switchGame(id)"
                      :class="gameId === id ? 'bg-sky-600 text-white' : 'text-slate-300 hover:bg-slate-800'"
                      class="shrink-0 rounded-md px-3 py-1.5 text-sm font-medium transition"
                      x-text="g.label"></button>
            </template>
          </template>
        </div>
      </div>
    </nav>

    <main class="mx-auto max-w-2xl px-4 py-8 sm:py-10">

      <!-- ── 未實作的遊戲:空頁 ── -->
      <template x-if="!game.implemented">
        <div class="py-20 text-center">
          <div class="text-5xl">🚧</div>
          <h2 class="mt-4 text-xl font-bold" x-text="game.label"></h2>
          <p class="mt-2 text-sm text-slate-400">此遊戲的標題產生器尚未實作，敬請期待。</p>
        </div>
      </template>

      <!-- ── IIDX（及未來已實作的遊戲）標題產生器 ── -->
      <template x-if="game.implemented">
        <div>
          <!-- 步驟一:模式 -->
          <section class="mb-6">
            <h2 class="mb-2 text-sm font-semibold text-slate-300">1. 模式</h2>
            <div class="flex gap-2">
              <template x-for="m in game.modes" :key="m">
                <button type="button" @click="setMode(m)"
                        :class="mode === m ? 'bg-sky-600 border-sky-500 text-white' : 'bg-slate-900 border-slate-700 text-slate-300 hover:border-slate-500'"
                        class="flex-1 rounded-lg border px-4 py-2 text-sm font-medium transition"
                        x-text="m"></button>
              </template>
            </div>
          </section>

          <!-- 步驟二:難度 -->
          <section class="mb-6">
            <h2 class="mb-2 text-sm font-semibold text-slate-300">2. 難度</h2>
            <div class="grid grid-cols-2 gap-2 sm:grid-cols-4">
              <template x-for="d in game.difficulties" :key="d.code">
                <button type="button" @click="setDiff(d.code)"
                        class="diff-btn"
                        :class="'diff-' + d.color + (diffCode === d.code ? ' is-active' : '')"
                        x-text="d.name"></button>
              </template>
            </div>
          </section>

          <!-- 步驟三起:各遊戲的額外選擇器(Clear / 過關評級 / FLARE…) -->
          <template x-for="(s, idx) in selectors" :key="s.key">
            <section class="mb-6">
              <div class="mb-2 flex items-center gap-3">
                <h2 class="text-sm font-semibold text-slate-300" x-text="(idx + 3) + '. ' + s.label"></h2>
                <template x-if="s.optional">
                  <button type="button" @click="toggleOptional(s.key)"
                          :class="optionalOn[s.key] ? 'bg-sky-600 text-white' : 'bg-slate-800 text-slate-400'"
                          class="rounded px-2 py-0.5 text-xs font-medium transition"
                          x-text="optionalOn[s.key] ? '開啟' : '關閉'"></button>
                </template>
              </div>
              <div class="flex flex-wrap gap-2" x-show="!s.optional || optionalOn[s.key]">
                <template x-for="opt in s.options" :key="opt">
                  <button type="button" @click="selectOption(s.key, opt)"
                          :class="values[s.key] === opt ? 'bg-sky-600 border-sky-500 text-white' : 'bg-slate-900 border-slate-700 text-slate-300 hover:border-slate-500'"
                          class="rounded-lg border px-3 py-1.5 text-sm font-medium transition"
                          x-text="(s.prefix || '') + opt"></button>
                </template>
              </div>
              <template x-if="s.optional && !optionalOn[s.key]">
                <p class="text-xs text-slate-500">已關閉，標題不含此欄。</p>
              </template>
            </section>
          </template>

          <!-- 搜尋歌曲 -->
          <section class="mb-6">
            <h2 class="mb-2 text-sm font-semibold text-slate-300" x-text="(selectors.length + 3) + '. 搜尋歌曲'"></h2>
            <template x-if="!chartKey">
              <p class="rounded-lg border border-dashed border-slate-700 px-3 py-3 text-sm text-slate-500">
                請先選擇「模式」與「難度」，才會依譜面過濾搜尋結果。
              </p>
            </template>
            <div x-show="chartKey">
              <input x-model="query" type="text" placeholder="輸入曲名 / 曲風 / artist…（模糊搜尋）"
                     class="w-full rounded-lg border border-slate-700 bg-slate-900 px-3 py-2 text-sm focus:border-sky-500 focus:outline-none" />
              <p class="mt-1 text-xs text-slate-500">
                僅顯示有
                <span class="font-mono text-slate-300" x-text="chartKey"></span>
                譜面的歌曲。
              </p>

              <ul class="mt-3 max-h-72 space-y-1 overflow-y-auto rounded-lg border border-slate-800 p-1">
                <template x-for="s in results" :key="s.key">
                  <li>
                    <button type="button" @click="selectSong(s)"
                            :class="selectedSong && selectedSong.key === s.key ? 'bg-sky-600/20 ring-1 ring-sky-500' : 'hover:bg-slate-800'"
                            class="flex w-full items-center justify-between gap-3 rounded-md px-3 py-2 text-left transition">
                      <span class="min-w-0">
                        <span class="block truncate text-sm text-slate-100" x-text="s.title"></span>
                        <span class="block truncate text-xs text-slate-500" x-text="s.artist"></span>
                      </span>
                      <span class="badge shrink-0 rounded px-2 py-0.5 font-mono text-xs"
                            :class="diff ? 'badge-' + diff.color : ''"
                            x-text="chartKey + ' ' + (game.levelPrefix || '') + levelOf(s)"></span>
                    </button>
                  </li>
                </template>
                <template x-if="results.length === 0">
                  <li class="px-3 py-4 text-center text-sm text-slate-500">找不到符合的歌曲。</li>
                </template>
              </ul>
            </div>
          </section>

          <!-- 結果:標題 + 複製 -->
          <section class="mt-8">
            <h2 class="mb-2 text-sm font-semibold text-slate-300">產生的標題</h2>
            <template x-if="!ready">
              <p class="rounded-lg border border-dashed border-slate-700 px-3 py-4 text-sm text-slate-500">
                完成上面 4 個步驟後，這裡會出現標題。
              </p>
            </template>
            <div x-show="ready" class="rounded-lg border border-slate-700 bg-slate-900 p-3">
              <p class="break-all font-mono text-sm text-emerald-300" x-text="title"></p>
              <button type="button" @click="copy()"
                      :class="copied ? 'bg-emerald-600' : 'bg-sky-600 hover:bg-sky-500'"
                      class="mt-3 w-full rounded-lg px-4 py-2 text-sm font-semibold text-white transition">
                <span x-text="copied ? '✓ 已複製' : '複製標題'"></span>
              </button>
            </div>
          </section>
        </div>
      </template>

    </main>
  </div>
</body>
</html>
